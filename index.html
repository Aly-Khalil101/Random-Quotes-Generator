<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Quotes Generator</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/all.min.css" />
    <!-- Css Files: -->
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/myFramework.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="mf-container">
        <h1>Random Quotes Generator</h1>
      </div>
    </header>
    <section class="screen-box">
      <span class="quote-id">0</span>
      <div class="quote">
        <p>Quote Will Appear Here</p>
        <div class="author">Unknown.</div>
      </div>
      <div class="btns">
        <button class="btn" id="btn-generate-quote">Generate Quote</button>
        <button class="btn" id="btn-auto-generate">Auto Generate</button>
        <button class="btn" id="btn-stop-generate">Stop Generate</button>
      </div>
    </section>
    <div class="auto-status"></div>
    <script src="main.js" defer></script>
  </body>
</html>
